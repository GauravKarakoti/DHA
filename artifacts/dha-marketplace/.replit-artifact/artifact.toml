kind = "web"
previewPath = "/"
title = "DHA — Digital Housing Assets"
description = "A premium Web3 learning marketplace for discovering and minting DHA digital plot NFTs on Ethereum Sepolia, with on-chain ownership and metadata exploration."
version = "1.0.0"
id = "artifacts/dha-marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21248

[services.development]
run = "pnpm --filter @workspace/dha-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dha-marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/dha-marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21248"
BASE_PATH = "/"
